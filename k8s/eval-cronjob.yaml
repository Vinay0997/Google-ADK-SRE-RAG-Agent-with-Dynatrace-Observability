apiVersion: batch/v1
kind: CronJob
metadata:
  name: golden-eval
  namespace: sre-agent
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: adk-observability-ksa
          containers:
            - name: golden-eval
              image: us-central1-docker.pkg.dev/adk-dynatrace-observability/cloud-run-source-deploy/google-adk-sre-rag-agent-with-dynatrace-observability/google-adk-sre-agent:eval-fix-20261108163716
              command: ["python", "-m", "evals.run_golden"]
              envFrom:
                - configMapRef:
                    name: agent-config
              env:
                - name: AGENT_URL
                  value: "http://google-adk-sre-agent"
                - name: OTEL_SERVICE_NAME
                  value: "google-adk-sre-agent-golden-eval"
                - name: BQ_ENABLED
                  value: "false"
                - name: POD_NAME
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.name
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
