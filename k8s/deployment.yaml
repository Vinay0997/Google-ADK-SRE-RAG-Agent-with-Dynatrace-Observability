apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-adk-sre-agent
  labels:
    app: google-adk-sre-agent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: google-adk-sre-agent
  template:
    metadata:
      labels:
        app: google-adk-sre-agent
    spec:
      serviceAccountName: adk-observability-ksa
      containers:
        - name: agent
          image: REGION-docker.pkg.dev/PROJECT_ID/REPOSITORY/google-adk-sre-agent:latest
          ports:
            - containerPort: 8080
          env:
            - name: GOOGLE_GENAI_USE_VERTEXAI
              value: "TRUE"
            - name: GOOGLE_CLOUD_PROJECT
              value: "PROJECT_ID"
            - name: GOOGLE_CLOUD_LOCATION
              value: "us-central1"
            - name: MODEL_NAME
              value: "gemini-3.8-flash"
            - name: OTEL_SERVICE_NAME
              value: "google-adk-sre-agent-gke"
            - name: DEPLOYMENT_ENVIRONMENT
              value: "gke"
            - name: DYNATRACE_OTLP_ENDPOINT
              value: "https://YOUR_ENVIRONMENT_ID.live.dynatrace.com/api/v2/otlp"
            - name: DYNATRACE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dynatrace-api-token
                  key: token
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
