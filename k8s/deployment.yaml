apiVersion: apps/v1
kind: Deployment
metadata:
  name: google-adk-sre-agent
  namespace: sre-agent
  labels:
    app: google-adk-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: google-adk-sre-agent
  template:
    metadata:
      labels:
        app: google-adk-sre-agent
    spec:
      serviceAccountName: adk-observability-ksa
      containers:
        - name: agent
          image: us-central1-docker.pkg.dev/adk-dynatrace-observability/cloud-run-source-deploy/google-adk-sre-rag-agent-with-dynatrace-observability/google-adk-sre-agent:eval-fix-20261108163716
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: agent-config
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
