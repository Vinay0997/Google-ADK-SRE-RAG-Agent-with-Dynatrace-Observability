apiVersion: apps/v1
kind: Deployment
metadata:
  name: sre-agent-ui
  namespace: sre-agent
  labels:
    app: sre-agent-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sre-agent-ui
  template:
    metadata:
      labels:
        app: sre-agent-ui
    spec:
      containers:
        - name: ui
          image: us-central1-docker.pkg.dev/adk-dynatrace-observability/cloud-run-source-deploy/sre-agent-ui@sha256:d6ab542bcb0fb743ed08287504a7d3257917929f86431a0a49547ed28670e72e
          ports:
            - containerPort: 8080
          env:
            - name: AGENT_URL
              value: "http://google-adk-sre-agent"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sre-agent-ui
  namespace: sre-agent
spec:
  type: ClusterIP
  selector:
    app: sre-agent-ui
  ports:
    - port: 80
      targetPort: 8080
