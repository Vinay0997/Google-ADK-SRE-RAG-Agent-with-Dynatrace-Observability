apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: sre-agent
data:
  GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
  GOOGLE_CLOUD_PROJECT: "${PROJECT_ID}"
  GOOGLE_CLOUD_LOCATION: "${REGION}"
  MODEL_NAME: "gemini-3.8-flash"
  OTEL_SERVICE_NAME: "google-adk-sre-agent-gke"
  DEPLOYMENT_ENVIRONMENT: "gke"
  OTEL_COLLECTOR_ENDPOINT: "http://otel-collector:4318"
  CAPTURE_PROMPTS: "true"
  # Set these to your model's real per-million-token pricing for the cost tile.
  INPUT_PRICE_PER_MTOK: "0.75"
  OUTPUT_PRICE_PER_MTOK: "3.75"
  BQ_ENABLED: "true"
  BQ_DATASET: "agent_observability"
  BQ_TABLE: "agent_executions"
  DT_OTLP_ENDPOINT: "${DT_OTLP_ENDPOINT}"
