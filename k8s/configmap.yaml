apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-config
  namespace: sre-agent
data:
  GOOGLE_GENAI_USE_VERTEXAI: "TRUE"
  GOOGLE_CLOUD_PROJECT: "adk-dynatrace-observability"
  GOOGLE_CLOUD_LOCATION: "global"

  MODEL_NAME: "gemini-3.8-flash"
  EVALUATOR_MODEL: "gemini-3.8-flash"

  OTEL_SERVICE_NAME: "google-adk-sre-agent-gke"
  DEPLOYMENT_ENVIRONMENT: "gke"
  OTEL_COLLECTOR_ENDPOINT: "http://otel-collector:4318"
  CAPTURE_PROMPTS: "false"

  BQ_ENABLED: "true"
  BQ_DATASET: "agent_observability"
  BQ_TABLE: "agent_executions"
  BQ_RAG_ENABLED: "true"
  BQ_RAG_FALLBACK: "false"
  BQ_MIN_SCORE: "0.55"

  DT_OTLP_ENDPOINT: "https://irm77846.live.dynatrace.com/api/v2/otlp"
