apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: google-adk-sre-agent
  namespace: sre-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: google-adk-sre-agent
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
